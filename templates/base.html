<!DOCTYPE html><html>
<head>
    <title>{% block title %}Expense Tracker{% endblock %}</title><meta name="viewport" content="width=device-width, initial-scale=1">

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:Arial, sans-serif;
        background:#111827;
        color:white;
    }

    .navbar{
        background:#1f2937;
        padding:15px 25px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .logo{
        font-size:22px;
        font-weight:bold;
    }

    .nav-links a{
        color:white;
        text-decoration:none;
        margin-left:15px;
    }

    .nav-links a:hover{
        color:#60a5fa;
    }

    .container{
        width:90%;
        max-width:1200px;
        margin:auto;
        padding:30px 0;
    }

    .card{
        background:#1f2937;
        padding:20px;
        border-radius:12px;
        margin-bottom:20px;
    }

    .form-control{
        width:100%;
        padding:12px;
        margin-bottom:15px;
        border:none;
        border-radius:8px;
    }

    .btn{
        padding:10px 18px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        color:white;
        text-decoration:none;
        display:inline-block;
    }

    .btn-primary{
        background:#2563eb;
    }

    .btn-success{
        background:#16a34a;
    }

    .btn-danger{
        background:#dc2626;
    }

    .btn-warning{
        background:#f59e0b;
        color:black;
    }

    .alert{
        background:#dc2626;
        padding:12px;
        border-radius:8px;
        margin-bottom:15px;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }

    th, td{
        padding:12px;
        border-bottom:1px solid #374151;
        text-align:left;
    }

    th{
        background:#374151;
    }

    @media(max-width:700px){

        .navbar{
            flex-direction:column;
            gap:10px;
        }

        .container{
            width:95%;
        }

    }

</style>

</head>
<body><div class="navbar">

    <div class="logo">
        Expense Tracker
    </div>

    <div class="nav-links">

        {% if session.get("user_id") %}

            <a href="/dashboard">Dashboard</a>
            <a href="/add_expense">Add Expense</a>
            <a href="/logout">Logout</a>

        {% else %}

            <a href="/login">Login</a>
            <a href="/signup">Signup</a>

        {% endif %}

    </div>

</div>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
