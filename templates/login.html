{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="card"><h1>Login</h1>

<br>

{% if error %}
    <div class="alert">
        {{ error }}
    </div>
{% endif %}

<form method="POST">

    <input
        type="text"
        name="name"
        placeholder="Username"
        class="form-control"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        class="form-control"
        required
    >

    <button
        type="submit"
        class="btn btn-primary"
    >
        Login
    </button>

</form>

<br>

<p>
    Don't have an account?
    <a href="/signup">
        Signup
    </a>
</p>

</div>{% endblock %}
